<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Comics - Hero Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --deep-space: #0B1426;
            --quantum-cyan: #00E5FF;
            --quantum-purple: #8B5CF6;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --warm-white: #F8FAFC;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--deep-space);
            color: var(--warm-white);
            overflow: hidden;
        }
        
        .banner-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.15) 0%, var(--deep-space) 70%);
        }
        
        .quantum-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: quantumFlow 12s ease-in-out infinite;
        }
        
        @keyframes quantumFlow {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                opacity: 0.3;
            }
            50% { 
                transform: scale(1.1) rotate(5deg);
                opacity: 0.6;
            }
        }
        
        .hero-text {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        .main-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            
            /* Gold to Silver gradient */
            background: linear-gradient(135deg, 
                #FFD700 0%, 
                #FFF8DC 25%, 
                #C0C0C0 50%, 
                #E5E5E5 75%, 
                #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: shimmerText 4s ease-in-out infinite;
            
            /* Metallic shadow effect */
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        @keyframes shimmerText {
            0%, 100% { 
                background-position: 0% 50%;
                text-shadow: 
                    0 2px 4px rgba(0, 0, 0, 0.3),
                    0 0 20px rgba(255, 215, 0, 0.3);
            }
            50% { 
                background-position: 100% 50%;
                text-shadow: 
                    0 2px 4px rgba(0, 0, 0, 0.3),
                    0 0 20px rgba(192, 192, 192, 0.5);
            }
        }
        
        .tagline {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            margin-bottom: 3rem;
            
            /* Subtle silver gradient */
            background: linear-gradient(135deg, 
                #E5E5E5 0%, 
                #C0C0C0 50%, 
                #F8F8FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .quantum-symbol {
            display: inline-block;
            font-family: 'Orbitron', monospace;
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 900;
            margin: 2rem 0;
            
            /* Cyan to Purple gradient */
            background: linear-gradient(135deg, 
                var(--quantum-cyan) 0%, 
                #40E0D0 25%,
                #9370DB 75%,
                var(--quantum-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: quantumPulse 3s ease-in-out infinite;
            
            /* Quantum glow effect */
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.5));
            position: relative;
        }
        
        .quantum-symbol::before {
            content: '<8>';
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, 
                var(--quantum-purple) 0%, 
                var(--quantum-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.3;
            animation: quantumEcho 3s ease-in-out infinite 0.5s;
        }
        
        @keyframes quantumPulse {
            0%, 100% { 
                background-position: 0% 50%;
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.5));
            }
            50% { 
                background-position: 100% 50%;
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.7));
            }
        }
        
        @keyframes quantumEcho {
            0%, 100% { 
                opacity: 0.3;
                transform: scale(1);
            }
            50% { 
                opacity: 0.1;
                transform: scale(1.1);
            }
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--quantum-cyan);
            border-radius: 50%;
            animation: float-particle 15s linear infinite;
            opacity: 0.6;
        }
        
        .particle:nth-child(odd) {
            background: var(--quantum-purple);
            animation-duration: 20s;
        }
        
        .particle:nth-child(3n) {
            background: var(--gold);
            animation-duration: 25s;
            opacity: 0.3;
        }
        
        @keyframes float-particle {
            0% {
                transform: translateY(100vh) translateX(0px);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) translateX(100px);
                opacity: 0;
            }
        }
        
        .cta-section {
            text-align: center;
            margin-top: 3rem;
            z-index: 10;
        }
        
        .cta-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: rgba(248, 250, 252, 0.8);
            max-width: 600px;
            line-height: 1.6;
        }
        
        .launch-date {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--quantum-cyan);
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        
        .btn-primary {
            display: inline-block;
            padding: 1.2rem 2.5rem;
            background: linear-gradient(135deg, var(--gold), #FFF8DC, var(--silver));
            color: var(--deep-space);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.05em;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 48px rgba(255, 215, 0, 0.5);
            background: linear-gradient(135deg, #FFF8DC, var(--gold), var(--silver));
        }
        
        @media (max-width: 768px) {
            .hero-text {
                padding: 0 1rem;
            }
            
            .cta-text {
                font-size: 1rem;
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="quantum-field"></div>
        
        <div class="particles">
            <!-- Particles will be generated by JavaScript -->
        </div>
        
        <div class="hero-text">
            <h1 class="main-title">SYNAPSE COMICS</h1>
            <p class="tagline">WHERE STORIES BECOME REALITY</p>
            
            <div class="quantum-symbol">&lt;8&gt;</div>
            
            <div class="cta-section">
                <p class="cta-text">
                    Join the Starlight Brigade. Receive your Forgotten Library Card. 
                    Help us build the digital Sanctuary where connection conquers division.
                </p>
                
                <div class="launch-date">KICKSTARTER LAUNCHING SEPTEMBER 2025</div>
                
                <a href="#" class="btn-primary">Get Your Library Card</a>
            </div>
        </div>
    </div>

    <script>
        // Generate floating particles
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random starting position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize particles when page loads
        document.addEventListener('DOMContentLoaded', createParticles);
        
        // Add subtle mouse interaction
        document.addEventListener('mousemove', (e) => {
            const quantumSymbol = document.querySelector('.quantum-symbol');
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            
            quantumSymbol.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
        });
    </script>
</body>
</html>
