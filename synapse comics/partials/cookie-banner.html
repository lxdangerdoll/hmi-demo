<div id="cookie-banner" style="position:fixed; inset:auto 0 0 0; background:#0E1731; color:#fff; padding:1rem; border-top:1px solid rgba(255,255,255,.1); z-index:9999; display:none;">
  <div style="max-width:1100px; margin:0 auto; display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
    <div style="flex:1 1 420px;">
      We use cookies for essential functionality and, with your consent, analytics/advertising (Google & Meta). 
      <a href="/privacy" style="color:#00E5FF;">Learn more</a>.
    </div>
    <div style="display:flex; gap:.5rem;">
      <button id="cookie-accept" class="btn btn-primary">Accept</button>
      <button id="cookie-decline" class="btn">Decline</button>
    </div>
  </div>
</div>
